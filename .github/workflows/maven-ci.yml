name: Java Maven Multi-OS CI

on:
  push:
  pull_request:

jobs:
  build:
    name: Test and Coverage on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest
          - macos-latest

    steps:
      # 1. Checkout source code
      - name: Checkout source code
        uses: actions/checkout@v4

      # 2. Setup JDK 17
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      # 3. Build, Test and Check Coverage
      - name: Maven Verify with JaCoCo
        run: mvn --batch-mode clean verify

      # 4. Upload JAR Artifact
      - name: Upload JAR Artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: BTT9-JAR-${{ matrix.os }}
          path: target/*.jar
          if-no-files-found: error
          retention-days: 7

      # 5. Upload JaCoCo HTML Report
      - name: Upload JaCoCo Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: BTT9-Coverage-${{ matrix.os }}
          path: target/site/jacoco/
          if-no-files-found: warn
          retention-days: 7
